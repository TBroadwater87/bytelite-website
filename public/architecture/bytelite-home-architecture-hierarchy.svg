<!-- ================= LEGEND ================= -->
<rect class="legbox" x="80" y="1330" width="1260" height="226" rx="12"/>
<text class="legttl" x="110" y="1364">STATUS LEGEND</text>

<text class="legk" x="110" y="1398">Functional Prototype</text>
<text class="legv" x="330" y="1398">The primary mechanism operates, but substantial refinement or integration remains.</text>

<text class="legk" x="110" y="1424">Advanced Prototype</text>
<text class="legv" x="330" y="1424">Most planned product structure exists and is being prepared for comprehensive validation.</text>

<text class="legk" x="110" y="1450">Integrated Prototype</text>
<text class="legv" x="330" y="1450">The system operates through another canonical platform or engine.</text>

<text class="legk" x="110" y="1476">Internal Validation</text>
<text class="legv" x="330" y="1476">Implementation exists and is undergoing repeatable internal correctness and integration testing.</text>

<text class="legk" x="110" y="1502">Private Alpha</text>
<text class="legv" x="330" y="1502">A restricted application build exists for controlled functionality and stability testing.</text>

<text class="legk" x="110" y="1528">Pilot Preparation</text>
<text class="legv" x="330" y="1528">The program is being prepared for participation but is not yet operating as a public beta.</text>

<text class="disc" x="720" y="1590" text-anchor="middle">Research status does not equal production readiness.</text>

