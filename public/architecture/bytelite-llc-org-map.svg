<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ByteLite LLC organizational map</title>
  <desc id="desc">ByteLite LLC parent company branching into public consumer products and private deterministic research technologies, each with its current canonical status.</desc>
  <defs>
    <style>
      .title { font: 700 42px Arial, Helvetica, sans-serif; letter-spacing: 0.5px; }
      .branch { font: 700 28px Arial, Helvetica, sans-serif; letter-spacing: 0.3px; }
      .item { font: 600 22px Arial, Helvetica, sans-serif; }
      .tag { font: 700 14px Arial, Helvetica, sans-serif; letter-spacing: 0.4px; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <g id="parent-organization">
    <rect x="575" y="35" width="450" height="90" rx="22" fill="#F5F3EE" stroke="#B99A55" stroke-width="4"/>
    <line x1="603" y1="111" x2="997" y2="111" stroke="#B99A55" stroke-width="3"/>
    <text x="800.0" y="93" text-anchor="middle" class="title" fill="#111318">ByteLite LLC</text>
  </g>
  <path d="M800 125 V175 H400 V220 M800 175 H1200 V220" class="line" stroke="#B99A55" stroke-width="4"/>

