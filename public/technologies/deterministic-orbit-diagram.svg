<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="bo-title bo-desc">
  <title id="bo-title">Deterministic astronomical calculation</title>
  <desc id="bo-desc">A geometric diagram of calculated celestial positions on concentric rings, representing local deterministic astronomical calculation rather than a generic fortune-teller motif.</desc>
  <defs>
    <style> .lbl { font: 600 14px Arial, Helvetica, sans-serif; fill: #a78bfa; } </style>
  </defs>
  <rect width="900" height="600" fill="#07090f"/>
  <g transform="translate(450,300)" fill="none" stroke="#a78bfa">
    <circle r="230" stroke-width="1" opacity="0.35"/>
    <circle r="170" stroke-width="1" opacity="0.35"/>
    <circle r="110" stroke-width="1" opacity="0.35"/>
    <circle r="50" stroke-width="1.5" opacity="0.55"/>
    <line x1="-230" y1="0" x2="230" y2="0" stroke-width="1" opacity="0.2"/>
    <line x1="0" y1="-230" x2="0" y2="230" stroke-width="1" opacity="0.2"/>
  </g>
  <g transform="translate(450,300)">
    <circle cx="0" cy="0" r="6" fill="#fbbf24"/>
    <circle cx="199" cy="-115" r="5" fill="#a78bfa"/>
    <circle cx="-85" cy="199" r="5" fill="#a78bfa"/>
    <circle cx="-208" cy="-58" r="4" fill="#818cf8"/>
    <circle cx="150" cy="182" r="4" fill="#818cf8"/>
    <circle cx="-40" cy="-108" r="4" fill="#818cf8"/>
    <circle cx="95" cy="-52" r="3.5" fill="#f472b6"/>
    <circle cx="-24" cy="48" r="3.5" fill="#f472b6"/>
  </g>
  <text x="450" y="560" text-anchor="middle" class="lbl">Positions calculated locally, deterministically, for a given date — not scraped, not generated by a hosted model.</text>
</svg>
