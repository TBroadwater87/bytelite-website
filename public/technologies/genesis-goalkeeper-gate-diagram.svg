<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="gg-title gg-desc">
  <title id="gg-title">Genesis Goalkeeper governance gate</title>
  <desc id="gg-desc">A candidate output or action passes through checks for consent, authority, identity, and harm accounting before it may be allowed, restrained, or halted.</desc>
  <defs>
    <style>
      .lbl { font: 700 22px Arial, Helvetica, sans-serif; fill: #e4e7f2; }
      .sub { font: 600 15px Arial, Helvetica, sans-serif; fill: #7b829e; }
      .out { font: 700 20px Arial, Helvetica, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="500" fill="#07090f"/>

  <rect x="30" y="200" width="200" height="100" rx="14" fill="#111318" stroke="#fb923c" stroke-width="2.5"/>
  <text x="130" y="245" text-anchor="middle" class="lbl">Candidate</text>
  <text x="130" y="270" text-anchor="middle" class="sub">output / action</text>

  <line x1="230" y1="250" x2="330" y2="250" stroke="#fb923c" stroke-width="3"/>
  <polygon points="330,250 316,242 316,258" fill="#fb923c"/>

  <rect x="340" y="130" width="520" height="340" rx="20" fill="#111318" stroke="#fb923c" stroke-width="3"/>
  <text x="600" y="172" text-anchor="middle" class="lbl">Genesis Goalkeeper</text>
  <text x="600" y="196" text-anchor="middle" class="sub">gate checks — none may be skipped</text>

  <g>
    <rect x="368" y="220" width="220" height="52" rx="12" fill="#161a26" stroke="#3a4266"/>
    <text x="478" y="252" text-anchor="middle" class="sub" fill="#c4c8f0">Consent resolved?</text>
    <rect x="612" y="220" width="220" height="52" rx="12" fill="#161a26" stroke="#3a4266"/>
    <text x="722" y="252" text-anchor="middle" class="sub" fill="#c4c8f0">Authority verified?</text>
    <rect x="368" y="284" width="220" height="52" rx="12" fill="#161a26" stroke="#3a4266"/>
    <text x="478" y="316" text-anchor="middle" class="sub" fill="#c4c8f0">Identity confirmed?</text>
    <rect x="612" y="284" width="220" height="52" rx="12" fill="#161a26" stroke="#3a4266"/>
    <text x="722" y="316" text-anchor="middle" class="sub" fill="#c4c8f0">Harm accounted for?</text>
  </g>
  <text x="600" y="440" text-anchor="middle" class="sub">Any unresolved check halts intrinsically — no arbitrary retry, no silent pass-through.</text>

  <line x1="860" y1="250" x2="960" y2="250" stroke="#fb923c" stroke-width="3"/>
  <polygon points="960,250 946,242 946,258" fill="#fb923c"/>

  <rect x="970" y="150" width="200" height="80" rx="14" fill="#0d2116" stroke="#4ade80" stroke-width="2.5"/>
  <text x="1070" y="197" text-anchor="middle" class="out" fill="#4ade80">Allow</text>

  <rect x="970" y="270" width="200" height="80" rx="14" fill="#241014" stroke="#f87171" stroke-width="2.5"/>
  <text x="1070" y="317" text-anchor="middle" class="out" fill="#f87171">Restrain / Halt</text>
</svg>
