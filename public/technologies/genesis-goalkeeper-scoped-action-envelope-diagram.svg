<svg xmlns="http://www.w3.org/2000/svg"
     width="1800" height="1100" viewBox="0 0 1800 1100"
     role="img" aria-labelledby="title desc">
  <title id="title">SCOPED ACTION ENVELOPE</title>
  <desc id="desc">A systems-engineering infographic showing a proposed external action contained within a bounded transaction envelope, ten required fields, and a governance gate with three possible outcomes.</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#4EA3D8"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2FC4B2"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C6A75B"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C95058"/>
    </marker>

    <style>
      .bg { fill:#071522; }
      .grid { stroke:#102A40; stroke-width:1; opacity:0.42; }
      .title { fill:#EAF3F8; font-family:Arial, Helvetica, sans-serif; font-size:50px; font-weight:700; letter-spacing:3px; }
      .subtitle { fill:#87A9BF; font-family:Arial, Helvetica, sans-serif; font-size:18px; letter-spacing:1.2px; }
      .envelope { fill:#0A1D2C; stroke:#4EA3D8; stroke-width:4; }
      .envelope-inner { fill:none; stroke:#255B7C; stroke-width:2; stroke-dasharray:10 9; }
      .section-label { fill:#4EA3D8; font-family:Arial, Helvetica, sans-serif; font-size:18px; font-weight:700; letter-spacing:2px; }
      .field { fill:#0D2D36; stroke:#2FC4B2; stroke-width:2.5; }
      .field-num { fill:#2FC4B2; font-family:Arial, Helvetica, sans-serif; font-size:15px; font-weight:700; }
      .field-text { fill:#EDF8F6; font-family:Arial, Helvetica, sans-serif; font-size:17px; font-weight:600; }
      .connector { fill:none; stroke:#4EA3D8; stroke-width:2.2; }
      .verified-dot { fill:#2FC4B2; stroke:#A7FFF3; stroke-width:1; }
      .core { fill:#102B42; stroke:#77BCE5; stroke-width:3; }
      .core-kicker { fill:#7FB4D4; font-family:Arial, Helvetica, sans-serif; font-size:16px; font-weight:700; letter-spacing:1.7px; }
      .core-text { fill:#FFFFFF; font-family:Arial, Helvetica, sans-serif; font-size:27px; font-weight:700; }
      .core-note { fill:#9AB8CB; font-family:Arial, Helvetica, sans-serif; font-size:15px; }
      .gate { fill:#302A1E; stroke:#C6A75B; stroke-width:4; }
      .gate-title { fill:#E9D294; font-family:Arial, Helvetica, sans-serif; font-size:29px; font-weight:700; letter-spacing:2px; }
      .gate-sub { fill:#BFAE7B; font-family:Arial, Helvetica, sans-serif; font-size:14px; }
      .outcome-auth { fill:#0E3938; stroke:#2FC4B2; stroke-width:2.5; }
      .outcome-clarify { fill:#24364A; stroke:#4EA3D8; stroke-width:2.5; }
      .outcome-halt { fill:#3A1D25; stroke:#C95058; stroke-width:2.5; }
      .outcome-text { fill:#F5F8FA; font-family:Arial, Helvetica, sans-serif; font-size:18px; font-weight:700; letter-spacing:0.4px; }
      .rule-box { fill:#091B2A; stroke:#4EA3D8; stroke-width:2.5; }
      .rule-main { fill:#D8E9F3; font-family:Arial, Helvetica, sans-serif; font-size:18px; font-weight:700; letter-spacing:0.4px; }
      .rule-accent { fill:#2FC4B2; font-family:Arial, Helvetica, sans-serif; font-size:18px; font-weight:700; }
      .blocked { stroke:#C95058; stroke-width:4; fill:none; stroke-dasharray:12 8; }
      .block-label { fill:#E68A91; font-family:Arial, Helvetica, sans-serif; font-size:15px; font-weight:700; letter-spacing:1px; }
      .gate-note { fill:#91AABA; font-family:Arial, Helvetica, sans-serif; font-size:14px; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1800" height="1100"/>
  <g id="engineering-grid" aria-hidden="true">
    <path class="grid" d="M0 100H1800 M0 200H1800 M0 300H1800 M0 400H1800 M0 500H1800 M0 600H1800 M0 700H1800 M0 800H1800 M0 900H1800 M0 1000H1800"/>
    <path class="grid" d="M100 0V1100 M200 0V1100 M300 0V1100 M400 0V1100 M500 0V1100 M600 0V1100 M700 0V1100 M800 0V1100 M900 0V1100 M1000 0V1100 M1100 0V1100 M1200 0V1100 M1300 0V1100 M1400 0V1100 M1500 0V1100 M1600 0V1100 M1700 0V1100"/>
  </g>

  <!-- Header -->
  <text class="title" x="900" y="68" text-anchor="middle">SCOPED ACTION ENVELOPE</text>
  <text class="subtitle" x="900" y="100" text-anchor="middle">BOUND INPUTS | REPRESENTED AUTHORITY | VERIFIED EXIT</text>

  <!-- Transaction envelope -->
  <g id="transaction-envelope">
    <rect class="envelope" x="50" y="135" width="1200" height="830" rx="32"/>
    <rect class="envelope-inner" x="68" y="153" width="1164" height="794" rx="24"/>
    <text class="section-label" x="92" y="186">TRANSACTION ENVELOPE</text>
  </g>

  <!-- Proposed action -->
  <g id="proposed-external-action">
    <rect class="core" x="455" y="390" width="390" height="170" rx="22"/>
    <text class="core-kicker" x="650" y="433" text-anchor="middle">PROPOSED</text>
    <text class="core-text" x="650" y="477" text-anchor="middle">EXTERNAL ACTION</text>
    <text class="core-note" x="650" y="515" text-anchor="middle">Contained pending complete representation and permission</text>
  </g>

  <!-- Required fields: left -->
  <g id="required-fields-left">
    <g id="field-1">
      <rect class="field" x="100" y="220" width="350" height="78" rx="12"/>
      <circle class="verified-dot" cx="128" cy="259" r="8"/>
      <text class="field-num" x="150" y="250">01</text>
      <text class="field-text" x="150" y="277">What action is requested?</text>
    </g>
    <g id="field-2">
      <rect class="field" x="100" y="325" width="350" height="78" rx="12"/>
      <circle class="verified-dot" cx="128" cy="364" r="8"/>
      <text class="field-num" x="150" y="355">02</text>
      <text class="field-text" x="150" y="382">Who or what is affected?</text>
    </g>
    <g id="field-3">
      <rect class="field" x="100" y="430" width="350" height="78" rx="12"/>
      <circle class="verified-dot" cx="128" cy="469" r="8"/>
      <text class="field-num" x="150" y="460">03</text>
      <text class="field-text" x="150" y="487">What authority allows it?</text>
    </g>
    <g id="field-4">
      <rect class="field" x="100" y="535" width="350" height="78" rx="12"/>
      <circle class="verified-dot" cx="128" cy="574" r="8"/>
      <text class="field-num" x="150" y="565">04</text>
      <text class="field-text" x="150" y="592">What is expected to change?</text>
    </g>
    <g id="field-5">
      <rect class="field" x="100" y="640" width="350" height="78" rx="12"/>
      <circle class="verified-dot" cx="128" cy="679" r="8"/>
      <text class="field-num" x="150" y="670">05</text>
      <text class="field-text" x="150" y="697">What could go wrong?</text>
    </g>
  </g>

  <!-- Required fields: right -->
  <g id="required-fields-right">
    <g id="field-6">
      <rect class="field" x="850" y="220" width="350" height="78" rx="12"/>
      <circle class="verified-dot" cx="878" cy="259" r="8"/>
      <text class="field-num" x="900" y="250">06</text>
      <text class="field-text" x="900" y="277">Can it be reversed?</text>
    </g>
    <g id="field-7">
      <rect class="field" x="850" y="325" width="350" height="78" rx="12"/>
      <circle class="verified-dot" cx="878" cy="364" r="8"/>
      <text class="field-num" x="900" y="355">07</text>
      <text class="field-text" x="900" y="382">How will success be verified?</text>
    </g>
    <g id="field-8">
      <rect class="field" x="850" y="430" width="350" height="78" rx="12"/>
      <circle class="verified-dot" cx="878" cy="469" r="8"/>
      <text class="field-num" x="900" y="460">08</text>
      <text class="field-text" x="900" y="487">What forces abort?</text>
    </g>
    <g id="field-9">
      <rect class="field" x="850" y="535" width="350" height="78" rx="12"/>
      <circle class="verified-dot" cx="878" cy="574" r="8"/>
      <text class="field-num" x="900" y="565">09</text>
      <text class="field-text" x="900" y="592">What audit record is created?</text>
    </g>
    <g id="field-10">
      <rect class="field" x="850" y="640" width="350" height="78" rx="12"/>
      <circle class="verified-dot" cx="878" cy="679" r="8"/>
      <text class="field-num" x="900" y="670">10</text>
      <text class="field-text" x="900" y="697">Does a human need to approve it?</text>
    </g>
  </g>

  <!-- Structural connectors -->
  <g id="field-connectors" aria-hidden="true">
    <path class="connector" d="M450 259 H500 V390"/>
    <path class="connector" d="M450 364 H520 V390"/>
    <path class="connector" d="M450 469 H455"/>
    <path class="connector" d="M450 574 H520 V560"/>
    <path class="connector" d="M450 679 H500 V560"/>

    <path class="connector" d="M850 259 H800 V390"/>
    <path class="connector" d="M850 364 H780 V390"/>
    <path class="connector" d="M850 469 H845"/>
    <path class="connector" d="M850 574 H780 V560"/>
    <path class="connector" d="M850 679 H800 V560"/>
  </g>

  <!-- Completeness rule -->
  <g id="completeness-rule">
    <rect class="rule-box" x="165" y="790" width="970" height="104" rx="15"/>
    <text class="rule-main" x="650" y="833" text-anchor="middle">NO EXTERNAL ACTION MAY LEAVE THE ENVELOPE UNTIL</text>
    <text class="rule-accent" x="650" y="868" text-anchor="middle">EVERY REQUIRED FIELD IS REPRESENTED AND THE GOVERNANCE GATE PERMITS IT.</text>
  </g>

  <!-- Blocked direct path -->
  <g id="blocked-direct-exit">
    <path class="blocked" d="M845 535 V748 H1232"/>
    <line x1="1200" y1="714" x2="1234" y2="782" stroke="#C95058" stroke-width="7"/>
    <line x1="1234" y1="714" x2="1200" y2="782" stroke="#C95058" stroke-width="7"/>
    <text class="block-label" x="1020" y="735" text-anchor="middle">DIRECT EXIT BLOCKED</text>
  </g>

  <!-- Valid route from complete envelope to governance -->
  <path id="valid-governance-route"
        d="M1135 842 H1268 V525 H1300"
        fill="none" stroke="#C6A75B" stroke-width="4" marker-end="url(#arrow-gold)"/>

  <!-- Governance gate -->
  <g id="governance-gate">
    <rect class="gate" x="1300" y="270" width="450" height="560" rx="26"/>
    <text class="gate-title" x="1525" y="330" text-anchor="middle">GOVERNANCE GATE</text>
    <text class="gate-sub" x="1525" y="360" text-anchor="middle">DECISION AT THE TRANSACTION ENVELOPE EXIT</text>

    <g id="outcome-authorized">
      <rect class="outcome-auth" x="1350" y="410" width="350" height="76" rx="13"/>
      <text class="outcome-text" x="1525" y="456" text-anchor="middle">AUTHORIZED ACTION</text>
    </g>

    <g id="outcome-clarification">
      <rect class="outcome-clarify" x="1350" y="525" width="350" height="76" rx="13"/>
      <text class="outcome-text" x="1525" y="571" text-anchor="middle">REQUEST CLARIFICATION</text>
    </g>

    <g id="outcome-halt">
      <rect class="outcome-halt" x="1350" y="640" width="350" height="76" rx="13"/>
      <text class="outcome-text" x="1525" y="686" text-anchor="middle">RESTRAIN OR HALT</text>
    </g>

    <text class="gate-note" x="1525" y="765" text-anchor="middle">Only the authorized outcome permits external execution.</text>
  </g>

  <!-- Outcome routing -->
  <g id="outcome-routing" aria-hidden="true">
    <path d="M1700 448 H1780" fill="none" stroke="#2FC4B2" stroke-width="4" marker-end="url(#arrow-teal)"/>
    <path d="M1350 563 H1270 V925 H1135" fill="none" stroke="#4EA3D8" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrow-blue)"/>
    <path d="M1350 678 H1245 V955 H1135" fill="none" stroke="#C95058" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-red)"/>
  </g>

  <text class="section-label" x="1775" y="420" text-anchor="end">PERMITTED EXIT</text>
</svg>
